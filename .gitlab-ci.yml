workflow:
  name: "Pipeline started at $CI_COMMIT_BRANCH branch"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "demo"
      when: always

include:
  - local: gitlab-ci-develop.yml
    rules:
      - if: $CI_COMMIT_REF_NAME =~ /develop/

  - local: gitlab-ci-demo.yml
    rules:
      - if: $CI_COMMIT_REF_NAME =~ /demo/


variables:
  AUTHOR: $CI_COMMIT_AUTHOR

default_job:
  stage: .pre
  script:
    - echo "Deployment started by '$AUTHOR'"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always


